[package]
name = "code-dungeon"
version = "0.1.0"
description = "Code Dungeon: il gioco in una finestra, collegato alla sessione MCP aperta"
authors = ["Armidon1"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
